<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — ShopClone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Sign in</h1>

    <form id="loginForm" class="auth-form">
      <input id="li-email" type="email" placeholder="Email address" required />
      <input id="li-password" type="password" placeholder="Password" required />
      <button type="submit" class="primary-btn">Sign in</button>
    </form>

    <p class="muted">New to ShopClone? <a href="signup.html">Create account</a></p>
    <p id="loginMsg" class="muted"></p>
  </main>

  <script src="script.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const loginMsg = document.getElementById('loginMsg');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('li-email').value.trim().toLowerCase();
      const password = document.getElementById('li-password').value;

      const users = JSON.parse(localStorage.getItem('sc_users') || '[]');
      const user = users.find(u => u.email === email && u.password === password);

      if (!user) {
        loginMsg.textContent = 'Invalid email or password.';
        loginMsg.style.color = '#d32f2f';
        return;
      }

      // Set session (only for current tab/session)
      sessionStorage.setItem('sc_currentUser', JSON.stringify({ name: user.name, email: user.email }));
      loginMsg.textContent = 'Signed in. Redirecting to home...';
      loginMsg.style.color = '#2e7d32';

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 800);
    });
  </script>
</body>
</html>
